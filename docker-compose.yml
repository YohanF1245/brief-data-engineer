version: '3.8'

services:
  data-api:
    build:
      context: /api/.
      dockerfile: Dockerfile
    container_name: data-api
    ports:
      - "555:555"
    volumes:
      - ./api:/api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
  sqlite:
    image: nouchka/sqlite3
    container_name: sqlite
    hostname: sqlite
    volumes:
      - ./sqlite:/sqlite
    stdin_open: true
    tty: true
    command: sh
      
  python-app:
    build:
      context: /app/.
      dockerfile: Dockerfile
    container_name: python-app
    depends_on:
      sqlite:
        condition: service_started
      data-api:
        condition: service_healthy
    ports:
      - "666:666"
    volumes:
      - ./sqlite:/sqlite